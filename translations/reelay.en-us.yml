#English - United States
en-us: 
  Start: Start
  Stop: Stop
  Movie: Movie
  MovieWithArticle: The movie
  Series: Series
  SeriesWithArticle: The series
  Start chatting: Start chatting with Reelay in Telegram. The first time you use "start" this chat will need an admin's approval.
  End: The adding/deleting of movies or series has ended.
  Title: "Enter the title:"
  What is this?: Is this a movie or a series?
  New: Execute a new search command
  Next result: No, show me the next result
  Add: Yes, add this
  Delete: Yes, delete this
  StopDelete: No, I don't want to delete this
  Select: Yes, select this
  Select a path: Please select a path for the movie or series
  Select a quality: Please select a quality profile for the movie or series
  Select from which season: From which season?
  Selected and future seasons: Selected and future seasons
  Season: Season
  Select all seasons: Select all seasons
  Deselect all seasons: Deselect all seasons
  Chatid added: "✅ An admin approved this chat — you can use Reelay here now. \nIf you were part-way through a command, send it again."
  NotAdmin: "That's an admin-only command. Ask an admin of your group to run it."
  Chatid already allowed: "This chat already has access — go ahead."
  # /help is assembled section by section in bot.py so it only ever lists what
  # this user can actually do here: a member doesn't see admin commands, a
  # group doesn't see DM-only ones, and a disabled service isn't advertised.
  Help:
    Header: "🎬 Reelay — request movies and shows for the group, and I'll tell you when they're ready."
    Requesting: "Requesting
      \n/%{add} — search for something and request it
      \n/%{movie} · /%{serie} — same thing, but say up front which one it is
      \n/app — dashboard: your requests, search, downloads, account"
    Account: "You
      \n/linkme — link your Plex/Overseerr account so requests are yours
      \n/remindme <days> — nudge me if I don't watch something (0 = never)
      \n/anonymize on|off — hide or show your name on group request posts"
    Groups: "Groups
      \n/join <code> — join a group using its invite code
      \n/switch — choose which group you're acting in"
    Library: "Library
      \n/%{delete} — remove a movie or show
      \n/%{allSeries} — what Sonarr already has
      \n/%{allMovies} — what Radarr already has"
    Downloads: "Downloads
      \n%{lines}"
    TransmissionLine: "/%{transmission} — toggle Transmission's speed limit"
    SabnzbdLine: "/%{sabnzbd} — set Sabnzbd's speed limit"
    Admin: "Admin
      \n/requestlink — nudge members who haven't linked a Plex account
      \n/routehere requests|updates — post that category in this topic
      \n/routes · /unroute <category> — see or clear routing
      \nMembers, roles, the invite code and the digest schedule live in /app → Members."
    GroupHeader: "🎬 Reelay here in %{title}."
    GroupUnclaimed: "I'm not activated in this group yet — a Telegram admin sends /claim here to do that."
    GroupRequestsOff: "Requests happen in a DM with me: tap my name, then /join with this group's invite code. (An admin can turn on requests in the group from /app → Members.)"
    GroupRequestsOn: "/%{add} — request something right here. /app opens your dashboard."
    Cat: "/cat — a cat picture or a cat fact, at random. That's the whole feature."
    Footer: "/%{help} shows this again."
  # One-line descriptions for the "/" menu Telegram shows in the compose box.
  # Telegram truncates these hard, so keep them short.
  Commands:
    Add: Search for a movie or show and request it
    Movie: Search for a movie and request it
    Series: Search for a series and request it
    App: Open your Reelay dashboard
    Join: Join a group with its invite code
    Linkme: Link your Plex/Overseerr account
    Remindme: "Remind me if I don't watch something (0 = never)"
    Anonymize: Show or hide your name on group requests
    Switch: "Choose which group you're acting in"
    Requestlink: "Admin: nudge members to link their Plex account"
    Cat: A random cat picture or cat fact
    Help: What Reelay can do
    Claim: Activate Reelay in this group (Telegram admins)
    Routehere: Post requests or updates in this topic
    Routes: Show where each category is posted
    Unroute: Stop posting a category here
  Missing config: "You are missing the following configkeys in your config.yaml-file: %{missingKeys}.
    \nAdd these before restarting the bot, or run `make config-migrate` to add them automatically."
  Wrong values: "The following configkeys has a wrong value in your config.yaml-file: %{wrongValues}.
    \nChange these before restarting the bot."
  NotYourRequest: "Those buttons belong to someone else's request 🙂 — send /%{add} to start your own."

  ChatAccess:
    Requested: "This chat can't use Reelay yet. I've asked the admins to approve it — I'll message you here as soon as one does, and then you can run your command again."
    StillPending: "Your request is already with the admins; nothing more to do but wait. I'll message you here when it's decided."
    AdminNotify: "🔐 %{name} (chat %{chat_id}) wants access to Reelay. Approve or deny it in /app → Members."
    Denied: "An admin turned down this chat's access request. If that's a surprise, ask them directly."
    Revoked: "An admin has revoked this chat's access to Reelay."

  GroupMode:
    Activated: "✅ %{name} is now a Reelay admin for this group.
      \n\nInvite code: %{code}
      \nShare it — members DM me `/join %{code}` to get in.
      \n\nNext: /app opens your dashboard, where you approve members and set everything else up."
    NeedsClaim: "👋 I'm in, but I don't know who runs this group yet — whoever added me isn't a Telegram admin here.
      \nAny Telegram admin of this group: send /claim in this chat to activate me."
    ClaimGroupOnly: "/claim has to be sent inside the group you want to activate, not here."
    ClaimNotAdmin: "Only a Telegram admin of this group can claim Reelay here. Ask one of them to send /claim."
    WelcomeNewMember: "👋 %{name}, I take movie and TV requests for this group.
      \nDM me [here](%{link}) and send `/join %{code}` to get started."
    SwitchDmOnly: "/switch only works in a private chat with me."
    OnlyOneScope: "You're only in one group (%{title}), so there's nothing to switch to."
    SwitchPrompt: "Which group do you want to act in? Requests and settings apply to whichever you pick."
    SwitchedTo: "Switched to %{title}. Requests you make now go to that group."
    SwitchedToDefault: "You're in more than one group, so I've assumed %{title} for now. Use /switch to change it."

  Onboarding:
    JoinDmOnly: "That one only works in a private chat with me — tap my name and send it there."
    JoinUsage: "Send /join followed by your group's invite code, like: /join ABCD2345
      \nAn admin of the group can get the code from their dashboard (/app → Members)."
    JoinBadCode: "That invite code isn't one of mine — codes are 8 characters, no O/0 or I/1.
      \nCheck it with whoever invited you; they can also generate a fresh one from /app → Members."
    JoinPending: "Thanks! Your request to join %{title} is with the admins now — I'll message you the moment it's approved."
    JoinApproved: "You're in %{title}! 🎉
      \nTwo quick questions next, then /app opens your dashboard."
    Approve: "✅ Approve"
    Deny: "🚫 Deny"
    ApprovalRequest: "%{name} wants to join %{title}."
    RequestGone: "That request no longer exists — someone may have handled it already."
    Approved: "Approved %{name}."
    Denied: "Denied %{name}."
    NoMembership: "You're not in a group with me yet. Ask whoever runs yours for the invite code, then send /join <code>."
    AskReminderDays: "1 of 2 — if you request something and never get round to watching it, should I check in?
      \n(I won't nudge you about anything you've already watched.)"
    AskReminderDaysHint: "Pick one, or reply with any number of days from 0 to 30."
    ReminderOff: "🔕 Never"
    Reminder3: "3 days"
    Reminder7: "7 days"
    Reminder14: "14 days"
    ReminderDaysInvalid: "I need a whole number of days between 0 and 30 — for example 3, or 0 to switch reminders off."
    ReminderDisabled: "Got it, no watch reminders. Change your mind any time with /remindme <days>."
    ReminderSet: "Got it — if something you requested is still unwatched after %{days} day(s), I'll check in. Change it with /remindme <days>."
    RemindmeUsage: "Send /remindme followed by a number of days, like: /remindme 3
      \nUse /remindme 0 to switch watch reminders off."
    ReminderNudge: "⏳ %{title} has been ready for a while and you asked for it — still planning to watch?
      \n(/remindme 0 turns these off.)"
    LinkPrompt: "Which Overseerr/Plex account is %{name}? Picking it means their requests show up under their own name, and I can tell what they've already watched."
    LinkSkip: "⏭ Skip for now"
    LinkSkipped: "No problem — /linkme whenever you're ready, or do it yourself from /app → Account."
    LinkDone: "🔗 Linked to %{account}. Requests will be attributed to that account from now on."
    LinkNoOverseerr: "There's no Overseerr set up on this bot, so there's no account to link to. Nothing you need to do."
    RoleChanged: "Your role in %{title} is now %{role}.
      \n· member — request things and see your own requests
      \n· editor — also sees the live download queue
      \n· admin — also manages members, routing and settings"
    Removed: "You've been removed from %{title}. Your requests already in Overseerr aren't affected."
    RequestLinkPrompt: "These members of %{title} haven't linked a Plex/Overseerr account yet, so their requests aren't attributed to them. Who should I nudge?"
    RequestLinkAllButton: "🔔 Ask everyone (%{count})"
    RequestLinkNoneUnlinked: "Everyone in %{title} already has their Plex account linked. 🎉"
    RequestLinkSent: "🔔 Asked %{name} to link their Plex account."
    RequestLinkSentAll: "🔔 Asked %{count} member(s) to link their Plex account."
    RequestLinkFailed: "Couldn't message %{name} — Telegram only lets me DM people who've messaged me first. Ask them to open a chat with me and send /linkme."
    LinkNudge: "🔔 An admin in %{title} asked you to link your Plex/Overseerr account.
      \nIt takes one tap and means your requests show up as yours — and that I won't nag you about something you've already watched."
    AskAnonymize: "2 of 2 — when you request something, the group gets a heads-up. Should that say it was you?"
    AskAnonymizeLegacy: "🔒 New setting: you can now choose whether your name shows up when you request something in the group. Which do you want?"
    AnonShowName: "🙂 Show my name"
    AnonKeepPrivate: "🙈 Keep me anonymous"
    AnonSetShown: "Got it, requests will be posted with your name. Change it any time with /anonymize on."
    AnonSetHidden: "Got it, your requests will be posted anonymously. Change it any time with /anonymize off."
    AnonymizeUsage: "Send /anonymize on to hide your name on group request posts, or /anonymize off to show it."

  messages:
    Add: Yes, add this %{subject}
