    Exist: "%{subjectWithArticle} already exists 😉"
    NoExist: "%{subjectWithArticle} does not exist"

  searchresults:
    zero: No results found
    one: One search result
    other: "%{count} search results"

  Overseerr:
    Requested: "✅ Requested %{title} — I'll message you when it's ready to watch. Track it any time in /app."
