    Prompt: "Your dashboard: requests, search, downloads and your account, all in one place."
    Open: "📱 Open Reelay"
    MenuButton: "Reelay"

  # /cat. The picture comes from cataas.com and the fact from catfact.ninja, so
  # the only copy here is what wraps them -- and what to say when both are down.
  Cat:
    PhotoCaption: "🐈 One cat, as ordered."
    Fact: "🐈 %{fact}"
    Unavailable: "No cats to be found just now — the picture and the fact are both out. Try /cat again in a bit."

