# Cat theme -- switched on with `theme: cat` in config.yaml.
#
# An overlay, not a translation: it only lists the keys whose wording changes,
# and anything left out keeps the neutral copy from translations/reelay.en-us.yml.
#
# A list of lines instead of one line means "pick one at random" (see
# reelay/translations.py). Worth it for anything a regular reaches several times
# a week -- a request confirmation, the weekly roundup -- and not worth it for
# something read once, where variety just buys you more sentences to review.
# The varied keys here run to ten lines each, which is roughly where a bot you
# talk to daily stops sounding like it only knows one joke.
#
# Three rules when editing:
#   * the joke never eats the instruction -- a themed line still has to say
#     what happened and what the human does next, in the same sentence;
#   * placeholders (%{title}, %{count}, ...) and command names must survive
#     verbatim in *every* variant, not just the first;
#   * variants of one key have to be interchangeable: same facts, same tone,
#     nothing that only reads correctly the first time.
# tests/test_prompts.py enforces the first two against the base file.
#
# Deliberately left plain: config errors, the admin notification feed, and the
# Transmission/Sabnzbd controls. Nobody wants a pun in the middle of a failure
# they're being paged about.
